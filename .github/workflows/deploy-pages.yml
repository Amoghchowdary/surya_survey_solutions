name: Deploy Surya Survey Solutions to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Block critical dependency vulnerabilities
        run: npm audit --audit-level=critical

      - name: Build V45 SEO for custom-domain GitHub Pages
        run: npm run build
        env:
          SITE_BASE_PATH: /

      - name: Prepare Pages artifact from TanStack SPA output
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pages-artifact
          mkdir -p pages-artifact

          if [ -f dist/client/_shell.html ]; then
            cp -R dist/client/. pages-artifact/
            cp pages-artifact/_shell.html pages-artifact/index.html
          elif [ -f dist/client/index.html ]; then
            cp -R dist/client/. pages-artifact/
          elif [ -f dist/_shell.html ]; then
            cp -R dist/. pages-artifact/
            cp pages-artifact/_shell.html pages-artifact/index.html
          elif [ -f dist/index.html ]; then
            cp -R dist/. pages-artifact/
          elif [ -f .output/public/_shell.html ]; then
            cp -R .output/public/. pages-artifact/
            cp pages-artifact/_shell.html pages-artifact/index.html
          elif [ -f .output/public/index.html ]; then
            cp -R .output/public/. pages-artifact/
          else
            echo "No deployable TanStack SPA shell found"
            find dist .output -maxdepth 4 -type f 2>/dev/null | sort || true
            exit 1
          fi

          test -f pages-artifact/index.html
          cp pages-artifact/index.html pages-artifact/404.html
          printf 'www.suryasurveysolutions.in\n' > pages-artifact/CNAME
          touch pages-artifact/.nojekyll
          echo "Prepared artifact:"
          find pages-artifact -maxdepth 2 -type f | sort | head -80

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-artifact

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
