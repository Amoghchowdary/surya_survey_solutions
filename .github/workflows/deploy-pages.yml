name: Deploy Surya Survey Solutions to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Block critical dependency vulnerabilities
        run: npm audit --audit-level=critical

      - name: Build V37 for GitHub Pages
        run: npm run build
        env:
          SITE_BASE_PATH: /surya_survey_solutions/

      - name: Verify static build and prepare fallback
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pages-artifact
          mkdir -p pages-artifact

          BUILD_DIR=""
          if [ -f dist/client/index.html ]; then
            BUILD_DIR="dist/client"
          elif [ -f dist/index.html ]; then
            BUILD_DIR="dist"
          elif [ -f .output/public/index.html ]; then
            BUILD_DIR=".output/public"
          else
            echo "Unable to locate built index.html"
            find . -maxdepth 3 -type f -name 'index.html' | sort
            exit 1
          fi

          echo "Using build directory: ${BUILD_DIR}"
          cp -R "${BUILD_DIR}/." pages-artifact/
          cp pages-artifact/index.html pages-artifact/404.html
          touch pages-artifact/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-artifact

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
