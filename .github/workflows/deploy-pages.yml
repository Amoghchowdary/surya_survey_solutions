name: Deploy Surya Survey Solutions to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Block critical dependency vulnerabilities
        run: npm audit --audit-level=critical

      - name: Build V38 for GitHub Pages
        run: npm run build
        env:
          SITE_BASE_PATH: /surya_survey_solutions/

      - name: Prepare TanStack SPA artifact for GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pages-artifact
          mkdir -p pages-artifact

          SHELL_FILE="$(find dist .output -type f \( -name '_shell.html' -o -name 'index.html' \) 2>/dev/null | head -n 1 || true)"

          if [ -z "${SHELL_FILE}" ]; then
            echo "ERROR: TanStack SPA shell was not found. Build output follows:"
            find dist .output -maxdepth 5 -type f 2>/dev/null | sort | head -n 300 || true
            exit 1
          fi

          BUILD_DIR="$(dirname "${SHELL_FILE}")"
          SHELL_NAME="$(basename "${SHELL_FILE}")"

          echo "Detected TanStack Pages build directory: ${BUILD_DIR}"
          echo "Detected shell: ${SHELL_NAME}"

          cp -R "${BUILD_DIR}/." pages-artifact/

          if [ "${SHELL_NAME}" = "_shell.html" ]; then
            cp "${SHELL_FILE}" pages-artifact/index.html
          elif [ ! -f pages-artifact/index.html ]; then
            cp "${SHELL_FILE}" pages-artifact/index.html
          fi

          test -f pages-artifact/index.html
          cp pages-artifact/index.html pages-artifact/404.html
          touch pages-artifact/.nojekyll

          echo "GitHub Pages artifact prepared successfully:"
          find pages-artifact -maxdepth 2 -type f | sort | head -n 100

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-artifact

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
